<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="目標九宮格">
  <meta name="theme-color" content="#ffffff">
  <title>目標九宮格</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c0: #ef4444; --c1: #f97316; --c2: #f59e0b;
      --c3: #06b6d4; --c4: #8b5cf6; --c5: #10b981;
      --c6: #ec4899; --c7: #3b82f6;
      --gold: #f59e0b;
      --bg: #f0f4f8;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #94a3b8;
      --shadow: 0 2px 10px rgba(0,0,20,0.07);
      --shadow-lg: 0 6px 24px rgba(0,0,20,0.1);
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Noto Sans TC', sans-serif;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Header ── */
    .app-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      padding-top: env(safe-area-inset-top, 0px);
      height: calc(52px + env(safe-area-inset-top, 0px));
      background: rgba(255,255,255,0.9);
      border-bottom: 1px solid var(--border);
      position: relative;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10;
    }

    .back-btn {
      position: absolute; left: 16px; bottom: 0; height: 52px;
      display: none; align-items: center; gap: 4px;
      color: var(--gold); background: none; border: none;
      font-size: 15px; font-weight: 600; cursor: pointer;
      padding: 0; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .back-btn.show { display: flex; }
    .back-btn svg { width: 18px; height: 18px; }

    .app-title {
      font-size: 17px; font-weight: 800;
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-right {
      position: absolute; right: 16px; bottom: 0; height: 52px;
      display: flex; align-items: center; gap: 6px;
    }

    .hdr-btn {
      display: flex; align-items: center; justify-content: center;
      height: 30px; padding: 0 11px; border-radius: 15px;
      border: 1.5px solid var(--border); background: none;
      color: var(--muted); font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, color 0.15s;
    }
    .hdr-btn:active { opacity: 0.7; }
    .hdr-btn.accent { border-color: var(--gold); color: var(--gold); }

    /* ── Main ── */
    .app-main { flex: 1; overflow: hidden; position: relative; }

    /* ── Overview ── */
    .view-overview {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 10px;
    }

    .mandala {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: min(calc(100dvw - 20px), calc(100dvh - 72px));
      aspect-ratio: 1 / 1;
    }

    .block {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2px;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      background: #e8edf3;
      box-shadow: var(--shadow);
    }
    .block:active { transform: scale(0.95); box-shadow: none; }

    .mini-cell {
      display: flex; align-items: center; justify-content: center;
      padding: 1px; overflow: hidden;
      font-size: clamp(6px, 1.5vw, 10px);
      line-height: 1.15; font-weight: 500;
      color: var(--text); text-align: center; word-break: break-all;
      background: #f8fafc;
    }
    .mini-cell.dim { color: #c8d3e0; }

    /* ── Detail View ── */
    .view-detail {
      width: 100%; height: 100%;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 12px 16px; gap: 10px;
    }
    .view-detail.show { display: flex; }

    .detail-label {
      font-size: 12px; color: var(--muted);
      text-align: center; letter-spacing: 0.02em;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 8px;
      width: min(calc(100dvw - 32px), calc(100dvh - 120px));
      aspect-ratio: 1 / 1;
    }

    .detail-cell {
      background: var(--surface);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 8px 6px;
      font-size: clamp(12px, 3.8vw, 16px); font-weight: 500;
      line-height: 1.3; cursor: pointer; word-break: break-all;
      border: 2px solid var(--border);
      box-shadow: var(--shadow);
      transition: transform 0.1s ease;
      -webkit-tap-highlight-color: transparent; color: var(--text);
    }
    .detail-cell:active { transform: scale(0.95); }
    .detail-cell.dim { color: var(--muted); }
    .detail-cell.is-main {
      border-color: var(--gold); color: var(--gold);
      font-weight: 800; font-size: clamp(13px, 4vw, 17px);
      background: #fffbeb;
    }
    .detail-cell.is-sub {
      font-weight: 700; font-size: clamp(13px, 4vw, 17px);
    }

    /* ── Edit Modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: all; }

    .modal-sheet {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%; max-width: 640px;
      padding: 16px 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -4px 32px rgba(0,0,20,0.12);
    }
    .modal-overlay.show .modal-sheet { transform: translateY(0); }

    .modal-handle {
      width: 36px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 0 auto 16px;
    }

    .modal-title {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px;
    }

    .modal-sheet textarea {
      width: 100%; background: var(--bg);
      border: 2px solid var(--border); border-radius: 12px;
      color: var(--text); font-family: inherit; font-size: 16px;
      padding: 12px 14px; resize: none; outline: none;
      transition: border-color 0.15s; line-height: 1.5; min-height: 80px;
    }
    .modal-sheet textarea:focus { border-color: var(--gold); }

    .modal-char-count {
      text-align: right; font-size: 11px; color: var(--muted); margin-top: 6px;
    }
    .modal-char-count.warn { color: #ef4444; }

    .modal-actions { display: flex; gap: 10px; margin-top: 12px; }

    .btn {
      flex: 1; padding: 13px; border-radius: 12px; border: none;
      font-size: 15px; font-weight: 700; cursor: pointer;
      font-family: inherit; -webkit-tap-highlight-color: transparent;
      transition: opacity 0.1s, transform 0.1s;
    }
    .btn:active { opacity: 0.8; transform: scale(0.97); }
    .btn-cancel { background: var(--bg); color: var(--text); border: 1.5px solid var(--border); }
    .btn-save { background: var(--gold); color: #fff; }

    /* ── Help Modal ── */
    .help-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .help-overlay.show { opacity: 1; pointer-events: all; }

    .help-sheet {
      background: var(--surface); border-radius: 20px 20px 0 0;
      width: 100%; max-width: 640px;
      padding: 16px 20px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 80dvh; overflow-y: auto;
      box-shadow: 0 -4px 32px rgba(0,0,20,0.12);
    }
    .help-overlay.show .help-sheet { transform: translateY(0); }

    .help-sheet h2 {
      font-size: 16px; font-weight: 800; color: var(--gold);
      margin-bottom: 14px; text-align: center;
    }
    .help-step { display: flex; gap: 12px; margin-bottom: 14px; align-items: flex-start; }
    .help-step-num {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--gold); color: #fff;
      font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .help-step-text { padding-top: 4px; font-size: 14px; line-height: 1.5; color: var(--text); }
    .help-step-text strong { color: var(--gold); }
    .help-close {
      width: 100%; margin-top: 16px; padding: 13px; border-radius: 12px;
      border: none; background: var(--gold); color: #fff;
      font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
    }

    /* ── Export FAB ── */
    .fab {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      right: 20px;
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(245,158,11,0.45);
      z-index: 50; -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .fab:active { transform: scale(0.92); box-shadow: 0 2px 10px rgba(245,158,11,0.3); }
    .fab svg { width: 22px; height: 22px; color: #fff; }

    /* ── Export Sheet ── */
    .export-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 400; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .export-overlay.show { opacity: 1; pointer-events: all; }

    .export-sheet {
      background: var(--surface); border-radius: 24px 24px 0 0;
      width: 100%; max-width: 640px;
      padding: 16px 20px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: 88dvh; overflow-y: auto;
      box-shadow: 0 -4px 32px rgba(0,0,20,0.12);
    }
    .export-overlay.show .export-sheet { transform: translateY(0); }

    .export-sheet h2 { font-size: 16px; font-weight: 800; color: var(--text); text-align: center; margin-bottom: 4px; }
    .export-sheet > p { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 18px; }

    .theme-list { display: flex; flex-direction: column; gap: 10px; }

    .theme-card {
      display: flex; align-items: center; gap: 14px;
      background: var(--bg); border-radius: 14px; padding: 12px;
      cursor: pointer; border: 2px solid transparent;
      transition: border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .theme-card:active { transform: scale(0.98); }
    .theme-card.selected { border-color: var(--gold); background: #fffbeb; }

    .theme-preview {
      width: 52px; height: 88px; border-radius: 8px;
      overflow: hidden; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .theme-preview canvas { width: 100%; height: 100%; display: block; }

    .theme-info { flex: 1; }
    .theme-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
    .theme-desc { font-size: 12px; color: var(--muted); }

    .theme-dl-btn {
      background: var(--border); color: var(--text);
      border: none; border-radius: 10px;
      padding: 8px 14px; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent; transition: background 0.15s;
    }
    .theme-card.selected .theme-dl-btn { background: var(--gold); color: #fff; }
    .theme-dl-btn:active { opacity: 0.8; }
    .theme-dl-btn:disabled { opacity: 0.5; }

    .export-close {
      width: 100%; margin-top: 14px; padding: 13px; border-radius: 12px;
      border: 1.5px solid var(--border); background: transparent; color: var(--muted);
      font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    }

    /* ── Save Preview Modal ── */
    .save-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.2s;
      padding: 20px; gap: 16px;
    }
    .save-overlay.show { opacity: 1; pointer-events: all; }

    .save-img-wrap {
      flex: 1; max-height: calc(100dvh - 160px);
      display: flex; align-items: center; justify-content: center;
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }
    .save-img-wrap img { max-height: 100%; max-width: 100%; display: block; border-radius: 16px; }

    .save-hint {
      font-size: 13px; color: rgba(255,255,255,0.7);
      text-align: center; line-height: 1.6;
    }
    .save-hint strong { color: #fff; }

    .save-actions { display: flex; gap: 10px; width: 100%; max-width: 360px; }

    .save-btn {
      flex: 1; padding: 13px; border-radius: 12px; border: none;
      font-size: 15px; font-weight: 700; cursor: pointer;
      font-family: inherit; -webkit-tap-highlight-color: transparent;
    }
    .save-btn-primary { background: var(--gold); color: #fff; }
    .save-btn-secondary { background: rgba(255,255,255,0.15); color: #fff; }
  </style>
</head>
<body>

<header class="app-header">
  <button class="back-btn" id="backBtn" onclick="goBack()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    返回
  </button>
  <h1 class="app-title" id="appTitle">目標九宮格</h1>
  <div class="header-right">
    <button class="hdr-btn accent" onclick="showExampleConfirm()">範例</button>
    <button class="hdr-btn" onclick="showHelp()">說明</button>
  </div>
</header>

<main class="app-main">
  <div class="view-overview" id="viewOverview">
    <div class="mandala" id="mandalaGrid"></div>
  </div>
  <div class="view-detail" id="viewDetail">
    <div class="detail-label" id="detailLabel"></div>
    <div class="detail-grid" id="detailGrid"></div>
  </div>
</main>

<!-- Edit Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle"></div>
    <textarea id="modalInput" rows="3" placeholder="輸入內容..." maxlength="60"></textarea>
    <div class="modal-char-count" id="charCount">0 / 60</div>
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn btn-save" onclick="saveModal()">儲存</button>
    </div>
  </div>
</div>

<!-- Export FAB -->
<button class="fab" onclick="showExport()" title="匯出桌布">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="7 10 12 15 17 10"/>
    <line x1="12" y1="15" x2="12" y2="3"/>
  </svg>
</button>

<!-- Export Sheet -->
<div class="export-overlay" id="exportOverlay" onclick="handleExportOverlayClick(event)">
  <div class="export-sheet">
    <div class="modal-handle"></div>
    <h2>匯出手機桌布</h2>
    <p>選擇風格，儲存 1080 × 1920 高清桌布到相簿</p>
    <div class="theme-list" id="themeList"></div>
    <button class="export-close" onclick="closeExport()">關閉</button>
  </div>
</div>

<!-- Save Preview -->
<div class="save-overlay" id="saveOverlay">
  <div class="save-img-wrap"><img id="savePreviewImg" src="" alt="桌布預覽"></div>
  <p class="save-hint" id="saveHint"></p>
  <div class="save-actions">
    <button class="save-btn save-btn-secondary" onclick="closeSavePreview()">關閉</button>
    <button class="save-btn save-btn-primary" id="saveActBtn" onclick="doSave()">儲存到相簿</button>
  </div>
</div>

<!-- Example Confirm Sheet -->
<div class="help-overlay" id="exampleOverlay" onclick="handleExampleOverlayClick(event)">
  <div class="help-sheet">
    <div class="modal-handle"></div>
    <h2>載入大谷翔平範例</h2>
    <div class="help-step">
      <div class="help-step-num" style="background:#06b6d4">大</div>
      <div class="help-step-text">
        這是棒球傳奇 <strong>大谷翔平</strong> 高中時親手填寫的曼陀羅目標圖。<br>
        主目標：<strong>獲得八大球團第一指名</strong>，展開逐夢之路。
      </div>
    </div>
    <div class="help-step">
      <div class="help-step-num" style="background:#ef4444">!</div>
      <div class="help-step-text" style="color:#ef4444">
        載入後將覆蓋你目前的資料，此操作無法復原。
      </div>
    </div>
    <div class="modal-actions" style="margin-top:8px">
      <button class="btn btn-cancel" onclick="closeExampleConfirm()">取消</button>
      <button class="btn btn-save" style="background:#06b6d4" onclick="confirmLoadExample()">載入範例</button>
    </div>
  </div>
</div>

<!-- Help Modal -->
<div class="help-overlay" id="helpOverlay" onclick="handleHelpClick(event)">
  <div class="help-sheet">
    <h2>曼陀羅思考法</h2>
    <div class="help-step">
      <div class="help-step-num">1</div>
      <div class="help-step-text">點擊<strong>中央區塊</strong>，在九宮格正中心填入你的<strong>主要目標</strong></div>
    </div>
    <div class="help-step">
      <div class="help-step-num">2</div>
      <div class="help-step-text">在中央區塊的<strong>8個格子</strong>填入達成主目標所需的<strong>8個子目標</strong></div>
    </div>
    <div class="help-step">
      <div class="help-step-num">3</div>
      <div class="help-step-text">點擊<strong>周圍8個區塊</strong>，每個區塊對應一個子目標，在其8個格子填入具體的<strong>行動方案</strong></div>
    </div>
    <div class="help-step">
      <div class="help-step-num">4</div>
      <div class="help-step-text">完成後你將擁有完整的目標地圖：1個主目標、8個子目標、64個行動方案</div>
    </div>
    <button class="help-close" onclick="closeHelp()">開始使用</button>
  </div>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────

const COLORS = ['#ef4444','#f97316','#f59e0b','#06b6d4','#8b5cf6','#10b981','#ec4899','#3b82f6'];
const GOLD = '#f59e0b';

const BLOCK_SG = [
  [0, 1, 2],
  [3,-1, 4],
  [5, 6, 7],
];
const CELL_IDX = [
  [0, 1, 2],
  [3,-1, 4],
  [5, 6, 7],
];

// ── Ohtani Example ────────────────────────────────────────────────────────

const OHTANI_EXAMPLE = {
  mainGoal: '獲得八大球團第一指名',
  subGoals: ['體力','控球','球質','心志','球速160公里','人品','運氣','變化球'],
  actions: [
    // 0 體力
    ['身體保養','吃營養品','FSQ90公斤','柔軟性','RSQ130公斤','鍛鍊體格','早三碗晚七碗','擴展可動範圍'],
    // 1 控球
    ['改善跑步','強化軀幹','保持軸心不晃動','穩定放球點','消除不安感','身體不要開掉','控制心理狀況','放球點往前'],
    // 2 球質
    ['製造角度','球從上往下壓','強化手腕','不過度用力','用下半身主導','順著軸心旋轉','提高球的轉速','強化下半身'],
    // 3 心志
    ['設立明確目標','不怠惰不忽喜忽憂','頭腦冷靜內心熱','加強危機應變','不受氣氛影響','情緒不起伏不定','對勝利執著','體諒隊友'],
    // 4 球速160公里

    // 5 人品

            } else {
              text = data.subGoals[ci];

          } else {
            if (ci === -1) {

const THEMES = [
  { id: 'sunny',   name: '晴日清新', desc: '純白簡約・繽紛活力' },
  { id: 'gold',    name: '奶油金線', desc: '暖金典雅・質感滿分' },

function makeRng(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(1664525, s) + 1013904223) >>> 0; return s / 4294967296; };
}

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function cellText(ctx, text, cx, cy, maxW, maxH, baseFontSize, color) {
  if (!text) return;
  ctx.save();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let fs = baseFontSize;
  const font = s => `700 ${s}px system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif`;
  ctx.font = font(fs);
  while (fs > baseFontSize * 0.52 && ctx.measureText(text).width > maxW - 8) {
    fs -= 2; ctx.font = font(fs);
  }
  if (ctx.measureText(text).width > maxW - 8 && text.length > 2) {
    const mid = Math.ceil(text.length / 2);
    const lh = fs * 1.3;
    ctx.fillText(text.slice(0, mid), cx, cy - lh/2);
    ctx.fillText(text.slice(mid), cx, cy + lh/2);
  } else {
    ctx.fillText(text, cx, cy);
  }
  ctx.restore();
}

function drawMandalaGrid(ctx, gx, gy, gs, theme) {
  const BG = Math.round(gs * 0.009);
  const BS = (gs - 2 * BG) / 3;
  const CG = Math.round(gs * 0.003);
  const CS = (BS - 2 * CG) / 3;
  const CCR = Math.round(CS * 0.12);
  const fs = Math.round(CS * 0.185);

  for (let br = 0; br < 3; br++) {
    for (let bc = 0; bc < 3; bc++) {
      const bx = gx + bc * (BS + BG);
      const by = gy + br * (BS + BG);
      const sgIdx = BLOCK_SG[br][bc];
      const isCenter = sgIdx === -1;

      if (theme.blockBg) {
        ctx.save();
        rr(ctx, bx, by, BS, BS, Math.round(BS * 0.06));
        ctx.fillStyle = theme.blockBg(isCenter, sgIdx);
        ctx.fill();
        ctx.restore();
      }

      for (let cr = 0; cr < 3; cr++) {
        for (let cc = 0; cc < 3; cc++) {
          const ci = CELL_IDX[cr][cc];
          const cx = bx + cc * (CS + CG);
          const cy = by + cr * (CS + CG);
          let fillColor, text, textColor, isHighlight;

          if (isCenter) {
            if (ci === -1) {
              fillColor = theme.mainColor; textColor = theme.mainTextColor;
              text = data.mainGoal || '主要目標'; isHighlight = true;
            } else {
              fillColor = theme.subColor(ci); textColor = theme.subTextColor;
              text = data.subGoals[ci] || `子目標${ci+1}`; isHighlight = true;
            }
          } else {
            if (ci === -1) {
              fillColor = theme.subColor(sgIdx); textColor = theme.subTextColor;
              text = data.subGoals[sgIdx] || `子目標${sgIdx+1}`; isHighlight = true;
            } else {
              fillColor = theme.actionColor(sgIdx); textColor = theme.actionTextColor(sgIdx);
              text = data.actions[sgIdx][ci]; isHighlight = false;
            }
          }

          ctx.save();
          // Shadow for highlighted cells in light themes
          if (theme.cellShadow && isHighlight) {
            ctx.shadowColor = fillColor + '55'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4;
          }
          if (theme.glow && isHighlight) {
            ctx.shadowColor = fillColor; ctx.shadowBlur = theme.glow;
          }
          rr(ctx, cx, cy, CS, CS, CCR);
          ctx.fillStyle = fillColor; ctx.fill();
          ctx.restore();

          cellText(ctx, text, cx + CS/2, cy + CS/2, CS, CS, fs, textColor);
        }
      }
    }
  }
}

// ── Theme: 晴日清新 ───────────────────────────────────────────────────────

function themeSunny() {
  return {
    cellShadow: true,
    mainColor: '#f59e0b', mainTextColor: '#fff',
    subColor: i => COLORS[i], subTextColor: '#fff',
    actionColor: i => COLORS[i] + '1e', actionTextColor: i => COLORS[i],
    bg(ctx, W, H) {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(0,0,0,0.03)';
      for (let x = 36; x < W; x += 36)
        for (let y = 36; y < H; y += 36) {
          ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI*2); ctx.fill();
        }
    },
    titleColor: '#1e293b', accentColor: '#f59e0b',
  };
}

// ── Theme: 奶油金線 ───────────────────────────────────────────────────────

function themeGoldLight() {
  return {
    cellShadow: false,
    mainColor: '#d4af37', mainTextColor: '#3d2b00',
    subColor: () => '#fef9e7', subTextColor: '#8B6914',
    actionColor: () => '#fffdf5', actionTextColor: () => '#b8972a',
    blockBg: () => '#fffdf5',
    bg(ctx, W, H) {
      ctx.fillStyle = '#fffdf5'; ctx.fillRect(0, 0, W, H);
      const g = ctx.createRadialGradient(W/2, H*0.42, 0, W/2, H*0.42, H*0.65);
      g.addColorStop(0, 'rgba(212,175,55,0.08)'); g.addColorStop(1, 'transparent');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(212,175,55,0.12)'; ctx.lineWidth = 1;
      for (let y = 60; y < H; y += 60) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
    },
    titleColor: '#8B6914', accentColor: '#d4af37',
    postDraw(ctx, W, H, gx, gy, gs) {
      const BG = Math.round(gs*0.009), BS = (gs-2*BG)/3;
      const CG = Math.round(gs*0.003), CS = (BS-2*CG)/3;
      ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2; ctx.globalAlpha = 0.65;
      for (let br = 0; br < 3; br++)
        for (let bc = 0; bc < 3; bc++) {
          const bx = gx+bc*(BS+BG), by = gy+br*(BS+BG);
          for (let cr = 0; cr < 3; cr++)
            for (let cc = 0; cc < 3; cc++) {
              rr(ctx, bx+cc*(CS+CG), by+cr*(CS+CG), CS, CS, Math.round(CS*0.12));
              ctx.stroke();
            }
        }
      ctx.globalAlpha = 1;
    },
  };
}

function themeCoral() {

// ── Theme: 天藍晴空 ───────────────────────────────────────────────────────

function themeSky() {
  const BC = ['#0ea5e9','#06b6d4','#3b82f6','#0284c7','#6366f1','#0891b2','#1d4ed8','#7c3aed'];
  return {

    bg(ctx, W, H) {

      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      // Clouds
      function cloud(ctx, cx, cy, r) {
        ctx.save(); ctx.fillStyle = 'rgba(255,255,255,0.72)';
        [[-r*.6,r*.05,r*.65],[0,0,r],[r*.65,r*.08,r*.6],[-.3*r,.3*r,.52*r],[.3*r,.28*r,.5*r]].forEach(([dx,dy,dr]) => {
          ctx.beginPath(); ctx.arc(cx+dx,cy+dy,dr,0,Math.PI*2); ctx.fill();
        });
        ctx.restore();
      }
      cloud(ctx, W*.14, H*.05, 60); cloud(ctx, W*.72, H*.04, 76); cloud(ctx, W*.44, H*.11, 50);
      cloud(ctx, W*.88, H*.17, 44); cloud(ctx, W*.22, H*.18, 38);
    },
    titleColor: '#0369a1', accentColor: '#0ea5e9',
  };
}

const THEME_FNS = { sunny: themeSunny, gold: themeGoldLight, lavender: themeLavender, coral: themeCoral, sky: themeSky };

// ── Wallpaper renderer ────────────────────────────────────────────────────

function renderWallpaper(themeId, W, H) {
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const theme = THEME_FNS[themeId]();

  theme.bg(ctx, W, H);

  const GS = Math.round(W * 0.87);
  const GX = Math.round((W - GS) / 2);
  const GY = Math.round(H * 0.185);

  // Title
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = theme.titleColor;
  ctx.font = `800 ${Math.round(W*0.062)}px system-ui,-apple-system,"PingFang TC",sans-serif`;
  ctx.fillText('目標九宮格', W/2, Math.round(H*0.072));

  if (data.mainGoal) {
    ctx.fillStyle = theme.accentColor || theme.titleColor;
    ctx.globalAlpha = 0.8;
    ctx.font = `600 ${Math.round(W*0.036)}px system-ui,-apple-system,"PingFang TC",sans-serif`;
    ctx.fillText(data.mainGoal, W/2, Math.round(H*0.122));
    ctx.globalAlpha = 1;
  }

  // Divider
  ctx.strokeStyle = theme.titleColor; ctx.globalAlpha = 0.15; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(GX, Math.round(H*0.152)); ctx.lineTo(GX+GS, Math.round(H*0.152)); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.restore();

  drawMandalaGrid(ctx, GX, GY, GS, theme);
  if (theme.postDraw) theme.postDraw(ctx, W, H, GX, GY, GS);

  // Footer
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = theme.titleColor; ctx.globalAlpha = 0.3;
  ctx.font = `500 ${Math.round(W*0.026)}px system-ui,-apple-system,"PingFang TC",sans-serif`;
  ctx.fillText('曼陀羅思考法　1主目標 · 8子目標 · 64行動', W/2, GY + GS + Math.round(H*0.022));
  ctx.globalAlpha = 1;
  ctx.restore();

  return canvas;
}

  THEMES.forEach(t => {
    const card = document.createElement('div');
    card.className = 'theme-card'; card.id = `tc-${t.id}`;

    const preview = document.createElement('div');
    preview.className = 'theme-preview';
    const thumb = renderWallpaper(t.id, 260, 440);
    thumb.style.cssText = 'width:100%;height:100%;display:block;';
    preview.appendChild(thumb);

    const info = document.createElement('div');
    info.className = 'theme-info';
    info.innerHTML = `<div class="theme-name">${t.name}</div><div class="theme-desc">${t.desc}</div>`;

    const dlBtn = document.createElement('button');
    dlBtn.className = 'theme-dl-btn';
    dlBtn.textContent = showShare ? '儲存' : '下載';
    dlBtn.onclick = e => { e.stopPropagation(); generateAndSave(t.id, dlBtn); };

    card.onclick = () => {
      document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    };
    card.append(preview, info, dlBtn);
    list.appendChild(card);
  });
  document.getElementById('exportOverlay').classList.add('show');
}

function closeExport() {
  document.getElementById('exportOverlay').classList.remove('show');
}
function handleExportOverlayClick(e) { if (e.target === e.currentTarget) closeExport(); }

// ── Generate + Save ───────────────────────────────────────────────────────

let _pendingBlob = null, _pendingFilename = '';

function generateAndSave(themeId, btn) {
  btn.textContent = '生成中…'; btn.disabled = true;
  setTimeout(() => {
    const canvas = renderWallpaper(themeId, WW, WH);
    const theme = THEMES.find(t => t.id === themeId);
    const filename = `目標九宮格_${theme.name}.png`;
    canvas.toBlob(blob => {
      btn.textContent = canShareFiles() ? '儲存' : '下載';
      btn.disabled = false;
      _pendingBlob = blob;
      _pendingFilename = filename;
      showSavePreview(canvas, filename);
    }, 'image/png');
  }, 50);
}

function showSavePreview(canvas, filename) {
  const img = document.getElementById('savePreviewImg');
  img.src = canvas.toDataURL('image/jpeg', 0.9); // JPEG for faster display

  const hintEl = document.getElementById('saveHint');
  const actBtn = document.getElementById('saveActBtn');

  if (canShareFiles()) {
    hintEl.innerHTML = '點擊「<strong>儲存到相簿</strong>」，在分享選單中選擇「儲存影像」';
    actBtn.textContent = '儲存到相簿';
  } else {
    hintEl.innerHTML = '桌布已生成，點擊下載或<strong>長按圖片</strong>儲存';
    actBtn.textContent = '下載圖片';
  }

  document.getElementById('saveOverlay').classList.add('show');
}

async function doSave() {
  if (!_pendingBlob) return;
  if (canShareFiles()) {
    const file = new File([_pendingBlob], _pendingFilename, { type: 'image/png' });
    try {
      await navigator.share({ files: [file], title: '目標九宮格桌布' });
      closeSavePreview();
    } catch(e) {
      if (e.name !== 'AbortError') fallbackDownload();
    }
  } else {
    fallbackDownload();
  }
}

function fallbackDownload() {
  const url = URL.createObjectURL(_pendingBlob);
  const a = document.createElement('a');
  a.href = url; a.download = _pendingFilename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function closeSavePreview() {
  document.getElementById('saveOverlay').classList.remove('show');
  _pendingBlob = null; _pendingFilename = '';
}

// ── Init ──────────────────────────────────────────────────────────────────

renderOverview();

if (!localStorage.getItem('mandala-launched')) {
  localStorage.setItem('mandala-launched', '1');
  setTimeout(showHelp, 400);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
